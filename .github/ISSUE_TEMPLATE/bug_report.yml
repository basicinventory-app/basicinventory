name: 🐞 Bug report
description: Something in BasicInventory does not work as it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Before you continue**
        - Search [existing issues](https://github.com/basicinventory-app/basicinventory/issues?q=is%3Aissue) — adding your details to an open one helps more than a duplicate.
        - Make sure you are on the current version — Windows keeps the Store copy updated (**Microsoft Store → Library → Get updates**); the problem may already be fixed.
        - **Never post licence keys, invoices, personal data or a database backup here.** This issue is public.
        - Found a **security** problem? Stop and follow [SECURITY.md](https://github.com/basicinventory-app/basicinventory/blob/main/SECURITY.md) instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true

  - type: input
    id: version
    attributes:
      label: BasicInventory version
      description: "Settings → Errors and diagnostics → Version. For example: 1.0.0"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
        - Windows Server 2019 / 2022
        - Other (say which below)
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Management mode
      description: Settings → Management mode
      options:
        - Boxes
        - Pallets
        - Not relevant / do not know
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exactly what you did, in order. Someone else must be able to follow it on a fresh installation.
      placeholder: |
        1. Go to Stock
        2. Filter by aisle A
        3. Click "Adjust" on the first row
        4. Enter 12 and confirm
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
      placeholder: The row should show 12 units and a new adjustment movement.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include the exact error message if there was one.
      placeholder: The row still shows 20 units and no movement is recorded.
    validations:
      required: true

  - type: input
    id: frequency
    attributes:
      label: How often does it happen?
      placeholder: "Every time · Sometimes (about 1 in 5) · Happened once"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: |
        Drag images in, or write "not applicable" if the problem cannot be seen.
        **Blur or crop anything confidential first** — this issue is public.
      placeholder: Paste or drag screenshots here.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and logs
      description: |
        In the app: **Settings → Errors and diagnostics → Copy diagnostics**, then paste here.
        It carries the version, your system details and the last errors, with your Windows user name removed from the paths.
      render: text
      placeholder: |
        BasicInventory 1.0.0 (production)
        System: win32 x64 · Node 24.15.0
        Log: <the folder shown in Settings → Errors and diagnostics>\logs\basicinventory.log
        ...
    validations:
      required: true

  - type: input
    id: data-size
    attributes:
      label: Roughly how much data is in your installation?
      description: Helps reproduce problems that only appear at scale.
      placeholder: "~800 items, ~15.000 movements"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Did it start after an update? Does it also happen on a fresh database? Anything you already tried?
    validations:
      required: false
